<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 30px;
        }

        .heading {
            box-sizing: border-box;
            width: 100%;
            max-width: 850px;
            border: 2px solid black;
            padding: 15px;
            text-align: center;
            background-color: white;
        }

        .heading h1 {
            margin: 0;
        }

        .main-container {
            box-sizing: border-box;
            border: 2px solid black;
            border-top: none;
            background-color: white;
            padding: 20px;
            width: 100%;
            max-width: 850px;
            min-height: 500px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        /* First column: checkbox */
        .checkbox-area {
            width: 55px;
            flex-shrink: 0;
        }

        .checkbox-area input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Second column: clickable photo */
        .image-area {
            width: 110px;
            flex-shrink: 0;
            text-align: center;
        }

        .image-area img {
            width: 100px;
            height: 75px;
            object-fit: cover;
            border: 2px solid black;
            border-radius: 5px;
            cursor: pointer;
        }

        .image-area img:hover {
            opacity: 0.7;
        }

        .image-area a {
            color: black;
            text-decoration: none;
            font-size: 12px;
        }

        /* Third column: textbox */
        .text-box {
            flex: 1;
            min-width: 0;
            min-height: 80px;
            padding: 10px;
            border: 2px solid #555;
            background-color: white;
            box-sizing: border-box;
        }

        .text-box h3 {
            margin: 0 0 8px;
        }

        .text-box input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }

        #capsWarning {
            display: none;
            color: red;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px;
            }

            .main-container {
                padding: 10px;
            }

            .row {
                gap: 7px;
            }

            .checkbox-area {
                width: 35px;
            }

            .image-area {
                width: 75px;
            }

            .image-area img {
                width: 68px;
                height: 55px;
            }

            .text-box {
                padding: 6px;
            }

            .text-box h3 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <header class="heading">
        <h1>Interactive Page</h1>
    </header>

    <main class="main-container">

        <!-- Row 1 -->
        <div class="row">
            <div class="checkbox-area">
                <label for="check1">1.</label>
                <input type="checkbox" id="check1">
            </div>

            <div class="image-area">
                <a href="description1.html">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTYMXXl56EqYec0Iac2t_IO718bYnbuvOTmHX54AZ-yPLvltUE_VnHv80&s=10"
                         alt="Photo 1">
                    <br>View details
                </a>
            </div>

            <div class="text-box">
                <h3>Textbook 1</h3>
                <input type="text" placeholder="Enter text here...">
            </div>
        </div>

        <!-- Row 2 -->
        <div class="row">
            <div class="checkbox-area">
                <label for="check2">2.</label>
                <input type="checkbox" id="check2">
            </div>

            <div class="image-area">
                <a href="description2.html">
                    <img src="https://www.stjohns.edu/sites/default/files/styles/640w/public/2025-09/sju_spring2018-172_960x640.jpg?itok=80ZGP3Tf"
                         alt="Photo 2">
                    <br>View details
                </a>
            </div>

            <div class="text-box">
                <h3>Textbook 2</h3>
                <input type="text" placeholder="Enter text here...">
            </div>
        </div>

        <!-- Row 3 -->
        <div class="row">
            <div class="checkbox-area">
                <label for="check3">3.</label>
                <input type="checkbox" id="check3">
            </div>

            <div class="image-area">
                <a href="description3.html">
                    <img src="https://www.shorttermprograms.com/images/cache/600_by_314/uploads/institution-logos/st-johns-university.png"
                         alt="Photo 3">
                    <br>View details
                </a>
            </div>

            <div class="text-box">
                <h3>Textbook 3</h3>
                <input type="text" placeholder="Enter text here...">
            </div>
        </div>

        <!-- Row 4 -->
        <div class="row">
            <div class="checkbox-area">
                <label for="check4">4.</label>
                <input type="checkbox" id="check4">
            </div>

            <div class="image-area">
                <a href="description4.html">
                    <img src="https://www.thoughtco.com/thmb/VLLLOxPDotFVe9Kojx29t03qjvY=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/st-johns-university-wiki-58ab8a153df78c345b5b8aa1.jpg"
                         alt="Photo 4">
                    <br>View details
                </a>
            </div>

            <div class="text-box">
                <h3>Textbook 4</h3>
                <input type="text" placeholder="Enter text here...">
            </div>
        </div>

        <!-- Row 5 -->
        <div class="row">
            <div class="checkbox-area">
                <label for="check5">5.</label>
                <input type="checkbox" id="check5">
            </div>

            <div class="image-area">
                <a href="description5.html">
                    <img src="https://www.stjohns.edu/sites/default/files/2026-05/20260501_stormin_loud_608_960x640.jpg"
                         alt="Photo 5">
                    <br>View details
                </a>
            </div>

            <div class="text-box">
                <h3>Textbook 5</h3>
                <input type="text" placeholder="Enter text here...">
            </div>
        </div>

        <p id="capsWarning">WARNING! Caps Lock is ON.</p>

    </main>

    <script>
        const inputs = document.querySelectorAll(
            '.text-box input[type="text"]'
        );

        const capsWarning = document.getElementById("capsWarning");

        inputs.forEach(function(input) {
            input.addEventListener("keyup", function(event) {
                capsWarning.style.display =
                    event.getModifierState("CapsLock")
                    ? "block"
                    : "none";
            });
        });
    </script>

</body>
</html>
